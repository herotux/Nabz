name: Nabz — Build selected branch

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: main
        type: string
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - desktop-arch
          - desktop-deb
          - raspberry-pi-arm64
          - windows-x64
          - all

permissions:
  contents: read

jobs:
  desktop-arch:
    if: inputs.target == 'desktop-arch' || inputs.target == 'desktop-deb' || inputs.target == 'all'
    runs-on: ubuntu-22.04
    steps:
      - name: Validate ref input
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          set -e
          if [[ -z "$BUILD_REF" || "$BUILD_REF" == -* || "$BUILD_REF" =~ [[:space:]] ]]; then
            echo "Invalid ref input" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libxdo-dev curl wget file patchelf libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libglib2.0-dev docker.io
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-web/src-tauri -> target
      - name: Generate app icon
        run: |
          python3 - <<'PY'
          import struct,zlib
          from pathlib import Path
          size=256; rows=[]
          for y in range(size):
            row=bytearray([0])
            for x in range(size):
              edge=min(x,y,size-1-x,size-1-y)
              bg=(20,128,88,255) if edge>=10 else (13,105,71,255)
              mark=(62<=x<=91 and 62<=y<=190) or (165<=x<=194 and 62<=y<=190)
              mark=mark or (62<=x<=194 and abs(y-(190-(x-62)*128/132))<=14)
              row.extend((245,249,255,255) if mark else bg)
            rows.append(bytes(row))
          def chunk(t,d): return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          png=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",size,size,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(b"".join(rows),9))+chunk(b"IEND",b"")
          p=Path("tauri-web/src-tauri/icons/icon.png");p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(png)
          PY
      - name: Install frontend dependencies and bundled font
        working-directory: tauri-web
        run: |
          npm install --no-audit --no-fund
          cd ..
          bash scripts/fetch-font.sh
      - name: Test and build frontend
        working-directory: tauri-web
        env:
          TAURI_ENV_PLATFORM: linux
        run: npm run test && npm run build
      - name: Test Rust core
        run: cargo test --manifest-path tauri-web/src-tauri/Cargo.toml --lib
      - name: Build executable
        run: cargo build --release --manifest-path tauri-web/src-tauri/Cargo.toml --bin nabz-tauri --features custom-protocol
      - name: Package Arch/Manjaro
        if: inputs.target == 'desktop-arch' || inputs.target == 'all'
        run: |
          set -eux
          mkdir -p tauri-web/packaging/arch
          install -Dm755 tauri-web/src-tauri/target/release/nabz-tauri tauri-web/packaging/arch/nabz-tauri
          install -Dm644 tauri-web/src-tauri/icons/icon.png tauri-web/packaging/arch/nabz.png
          install -Dm644 LICENSE tauri-web/packaging/arch/LICENSE
          cat > tauri-web/packaging/arch/nabz.desktop <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=نبض
          GenericName=حسابداری فروشگاهی
          Comment=حسابداری فروشگاهی فارسی
          Exec=nabz
          Icon=nabz
          Terminal=false
          Categories=Office;Finance;
          StartupNotify=true
          DESKTOP
          docker run --rm -v "$PWD/tauri-web/packaging/arch:/pkg" archlinux:latest bash -lc '
            pacman -Syu --noconfirm --needed base-devel webkit2gtk-4.1 gtk3 openssl
            useradd --create-home builder
            chown -R builder:builder /pkg
            cd /pkg
            runuser -u builder -- makepkg --cleanbuild --noconfirm
          '
          sudo chown -R "$USER:$USER" tauri-web/packaging/arch
          pkg=$(find tauri-web/packaging/arch -name '*.pkg.tar.zst' -type f -print -quit)
          test -s "$pkg"
          sha256sum "$pkg" > "$pkg.sha256"
      - name: Upload Arch/Manjaro package
        if: inputs.target == 'desktop-arch' || inputs.target == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: Nabz-Arch-Manjaro-x86_64
          path: |
            tauri-web/packaging/arch/*.pkg.tar.zst
            tauri-web/packaging/arch/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Package Debian / Ubuntu (.deb)
        if: inputs.target == 'desktop-deb' || inputs.target == 'all'
        run: |
          set -eux
          VERSION="$(node -p "require('./tauri-web/package.json').version")"
          STAGE="$RUNNER_TEMP/nabz-deb"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/usr/bin" "$STAGE/usr/share/applications" "$STAGE/usr/share/icons/hicolor/256x256/apps" "$STAGE/usr/share/doc/nabz"
          install -Dm755 tauri-web/src-tauri/target/release/nabz-tauri "$STAGE/usr/bin/nabz"
          install -Dm644 tauri-web/src-tauri/icons/icon.png "$STAGE/usr/share/icons/hicolor/256x256/apps/nabz.png"
          install -Dm644 LICENSE "$STAGE/usr/share/doc/nabz/copyright"
          cat > "$STAGE/usr/share/applications/nabz.desktop" <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=نبض
          GenericName=حسابداری فروشگاهی
          Comment=حسابداری فروشگاهی فارسی
          Exec=nabz
          Icon=nabz
          Terminal=false
          Categories=Office;Finance;
          StartupNotify=true
          DESKTOP
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: nabz
          Version: $VERSION
          Section: office
          Priority: optional
          Architecture: amd64
          Maintainer: Herotux <herotux@users.noreply.github.com>
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1, libssl3, libxdo3
          Description: Persian RTL shop accounting application
           Nabz is a Persian-language accounting application for shops.
          EOF
          dpkg-deb --build --root-owner-group "$STAGE" "Nabz_${VERSION}_amd64.deb"
          dpkg-deb --info "Nabz_${VERSION}_amd64.deb"
          dpkg-deb --contents "Nabz_${VERSION}_amd64.deb"
          sha256sum "Nabz_${VERSION}_amd64.deb" > "Nabz_${VERSION}_amd64.deb.sha256"
      - name: Upload Debian package
        if: inputs.target == 'desktop-deb' || inputs.target == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: Nabz-Debian-Ubuntu-amd64
          path: |
            Nabz_*.deb
            Nabz_*.deb.sha256
          if-no-files-found: error
          retention-days: 30

  windows-x64:
    if: inputs.target == 'windows-x64' || inputs.target == 'all'
    runs-on: windows-2022
    steps:
      - name: Validate ref input
        env:
          BUILD_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          set -e
          if [[ -z "$BUILD_REF" || "$BUILD_REF" == -* || "$BUILD_REF" =~ [[:space:]] ]]; then
            echo "Invalid ref input" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Windows build dependencies
        run: choco install -y wixtoolset
      - name: Install frontend dependencies and bundled font
        working-directory: tauri-web
        shell: bash
        run: |
          npm install --no-audit --no-fund
          cd ..
          bash scripts/fetch-font.sh
      - name: Generate Windows icon
        shell: pwsh
        run: |
          python -m pip install --user pillow
          python - <<'PY'
          from PIL import Image
          p = "tauri-web/src-tauri/icons/icon.png"
          im = Image.open(p).convert("RGBA")
          im.save("tauri-web/src-tauri/icons/icon.ico", sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          PY
          $config = Get-Content tauri-web/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.bundle.icon += "icons/icon.ico"
          $config.bundle.active = $true
          $config | ConvertTo-Json -Depth 30 | Set-Content tauri-web/src-tauri/tauri.conf.json -Encoding utf8
      - name: Test and build frontend
        working-directory: tauri-web
        run: npm run test && npm run build
      - name: Test Rust core
        run: cargo test --manifest-path tauri-web/src-tauri/Cargo.toml --lib
      - name: Build Windows MSI installer
        working-directory: tauri-web
        run: npm run tauri -- build --bundles msi --features custom-protocol
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Nabz-Windows-x64
          path: tauri-web/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

  raspberry-pi-arm64:
    if: inputs.target == 'raspberry-pi-arm64' || inputs.target == 'all'
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Validate ref input
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          set -e
          if [[ -z "$BUILD_REF" || "$BUILD_REF" == -* || "$BUILD_REF" =~ [[:space:]] ]]; then
            echo "Invalid ref input" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Verify ARM runner
        run: test "$(uname -m)" = "aarch64"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libxdo-dev curl wget file patchelf zip libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libglib2.0-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-web/src-tauri -> target
      - name: Generate app icon
        run: |
          python3 - <<'PY'
          import struct,zlib
          from pathlib import Path
          size=256; rows=[]
          for y in range(size):
            row=bytearray([0])
            for x in range(size):
              edge=min(x,y,size-1-x,size-1-y)
              bg=(20,128,88,255) if edge>=10 else (13,105,71,255)
              mark=(62<=x<=91 and 62<=y<=190) or (165<=x<=194 and 62<=y<=190)
              mark=mark or (62<=x<=194 and abs(y-(190-(x-62)*128/132))<=14)
              row.extend((245,249,255,255) if mark else bg)
            rows.append(bytes(row))
          def chunk(t,d): return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          png=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",size,size,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(b"".join(rows),9))+chunk(b"IEND",b"")
          p=Path("tauri-web/src-tauri/icons/icon.png");p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(png)
          PY
      - name: Install frontend dependencies and font
        working-directory: tauri-web
        run: |
          npm install --no-audit --no-fund
          cd ..
          bash scripts/fetch-font.sh
      - name: Test and build frontend
        working-directory: tauri-web
        env:
          TAURI_ENV_PLATFORM: linux
        run: npm run test && npm run build
      - name: Test Rust core
        run: cargo test --manifest-path tauri-web/src-tauri/Cargo.toml --lib
      - name: Build ARM64 executable
        run: |
          cargo build --release --manifest-path tauri-web/src-tauri/Cargo.toml --bin nabz-tauri --features custom-protocol
          file tauri-web/src-tauri/target/release/nabz-tauri
          readelf -h tauri-web/src-tauri/target/release/nabz-tauri | grep -q AArch64
      - name: Assemble Raspberry Pi ZIP
        run: |
          set -eux
          VERSION=$(node -p "require('./tauri-web/package.json').version")
          STAGE="$RUNNER_TEMP/Nabz-Raspberry-Pi-ARM64"
          mkdir -p "$STAGE/bin" "$STAGE/share/applications" "$STAGE/share/icons"
          install -Dm755 tauri-web/src-tauri/target/release/nabz-tauri "$STAGE/bin/nabz"
          install -Dm644 tauri-web/src-tauri/icons/icon.png "$STAGE/share/icons/nabz.png"
          install -Dm644 LICENSE "$STAGE/LICENSE"
          cat > "$STAGE/share/applications/nabz.desktop" <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=نبض
          GenericName=حسابداری فروشگاهی
          Comment=حسابداری فروشگاهی فارسی
          Exec=nabz
          Icon=nabz
          Terminal=false
          Categories=Office;Finance;
          StartupNotify=true
          DESKTOP
          cp tauri-web/packaging/raspberry-pi/install.sh "$STAGE/install.sh"
          chmod +x "$STAGE/install.sh"
          cat > "$STAGE/README-FA.txt" <<EOF
          نصب نبض روی Raspberry Pi OS 64-bit
          نسخه: $VERSION
          معماری: ARM64/aarch64
          فایل ZIP را استخراج و اجرا کن: ./install.sh
          نصب‌کننده وابستگی‌ها را نصب کرده و داده‌های کاربر را حفظ می‌کند.
          EOF
          (cd "$RUNNER_TEMP" && zip -qr "Nabz-Raspberry-Pi-ARM64.zip" "Nabz-Raspberry-Pi-ARM64")
          mv "$RUNNER_TEMP/Nabz-Raspberry-Pi-ARM64.zip" .
          sha256sum Nabz-Raspberry-Pi-ARM64.zip > Nabz-Raspberry-Pi-ARM64.zip.sha256
      - name: Package Raspberry Pi Debian (.deb)
        run: |
          set -eux
          VERSION="$(node -p "require('./tauri-web/package.json').version")"
          STAGE="$RUNNER_TEMP/nabz-pi-deb"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/usr/bin" "$STAGE/usr/share/applications" "$STAGE/usr/share/icons/hicolor/256x256/apps" "$STAGE/usr/share/doc/nabz"
          install -Dm755 tauri-web/src-tauri/target/release/nabz-tauri "$STAGE/usr/bin/nabz"
          install -Dm644 tauri-web/src-tauri/icons/icon.png "$STAGE/usr/share/icons/hicolor/256x256/apps/nabz.png"
          install -Dm644 LICENSE "$STAGE/usr/share/doc/nabz/copyright"
          cat > "$STAGE/usr/share/applications/nabz.desktop" <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=نبض
          GenericName=حسابداری فروشگاهی
          Comment=حسابداری فروشگاهی فارسی
          Exec=nabz
          Icon=nabz
          Terminal=false
          Categories=Office;Finance;
          StartupNotify=true
          DESKTOP
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: nabz
          Version: $VERSION
          Section: office
          Priority: optional
          Architecture: arm64
          Maintainer: Herotux <herotux@users.noreply.github.com>
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1, libssl3, libxdo3
          Description: Persian RTL shop accounting application
           Nabz is a Persian-language accounting application for shops.
          EOF
          dpkg-deb --build --root-owner-group "$STAGE" "Nabz_${VERSION}_arm64.deb"
          dpkg-deb --info "Nabz_${VERSION}_arm64.deb"
          dpkg-deb --contents "Nabz_${VERSION}_arm64.deb"
          sha256sum "Nabz_${VERSION}_arm64.deb" > "Nabz_${VERSION}_arm64.deb.sha256"
      - name: Upload Raspberry Pi Debian package
        uses: actions/upload-artifact@v4
        with:
          name: Nabz-Raspberry-Pi-Debian-arm64
          path: |
            Nabz_*_arm64.deb
            Nabz_*_arm64.deb.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload Raspberry Pi artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nabz-Raspberry-Pi-ARM64
          path: |
            Nabz-Raspberry-Pi-ARM64.zip
            Nabz-Raspberry-Pi-ARM64.zip.sha256
          if-no-files-found: error
          retention-days: 30

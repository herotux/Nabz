name: Nabz Visual Refresh Build
on:
  pull_request:
    branches:
      - ui/react-tauri-redesign
    paths:
      - "tauri-web/**"
      - ".github/workflows/nabz-visual-refresh.yml"
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-web/package-lock.json
      - run: npm ci
      - run: npm run build

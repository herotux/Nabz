name: Build Linux installers
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tauri-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libxdo-dev curl wget file patchelf libfuse2 \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - name: Generate a valid PNG app icon
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          size = 256
          rows = []
          for y in range(size):
              row = bytearray([0])
              for x in range(size):
                  edge = min(x, y, size - 1 - x, size - 1 - y)
                  bg = (min(20 + x // 32, 28), min(112 + y // 12, 140), min(170 + x // 16, 195), 255)
                  if edge < 10:
                      bg = (18, 92, 148, 255)
                  mark = (62 <= x <= 91 and 62 <= y <= 190) or (165 <= x <= 194 and 62 <= y <= 190)
                  mark = mark or (62 <= x <= 194 and abs(y - (190 - (x - 62) * 128 / 132)) <= 14)
                  row.extend((245, 249, 255, 255) if mark else bg)
              rows.append(bytes(row))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          png = b"\\x89PNG\\r\\n\\x1a\\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
          png += chunk(b"IEND", b"")
          target = Path("src-tauri/icons/icon.png")
          target.write_bytes(png)
          print(f"Generated valid {size}x{size} RGBA PNG: {target} ({len(png)} bytes)")
          PY
          file src-tauri/icons/icon.png

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend and type-check
        run: npm run build

      - name: Run Rust and SQLite tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri AppImage and deb
        run: npm run tauri build

      - name: Verify generated installers
        run: |
          set -eu
          find src-tauri/target/release/bundle -type f \\
            \\( -name '*.AppImage' -o -name '*.deb' \\) -size +0c -print
          test -n "$(find src-tauri/target/release/bundle -type f \\( -name '*.AppImage' -o -name '*.deb' \\) -size +0c -print -quit)"
          test -n "$(find src-tauri/target/release/bundle -type f -name '*.AppImage' -size +0c -print -quit)"
          test -n "$(find src-tauri/target/release/bundle -type f -name '*.deb' -size +0c -print -quit)"

      - name: Upload Tauri Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: nabz-linux-x86_64
          path: |
            tauri-web/src-tauri/target/release/bundle/**/*.AppImage
            tauri-web/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Publish release assets for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tauri-web/src-tauri/target/release/bundle/**/*.AppImage
            tauri-web/src-tauri/target/release/bundle/**/*.deb
          generate_release_notes: true

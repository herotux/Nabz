name: Build legacy Linux packages (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfuse2 flatpak flatpak-builder python3-yaml python3-toml python3-requests python3-pip librsvg2-bin
      - name: Fetch bundled Persian font
        run: bash scripts/fetch-font.sh
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Create portable archive
        run: |
          mkdir -p dist/nabz
          install -m 0755 target/release/nabz dist/nabz/nabz
          cp README.md LICENSE dist/nabz/
          cp assets/Vazirmatn.ttf assets/OFL.txt dist/nabz/
          tar -C dist -czf Nabz-linux-x86_64.tar.gz nabz
      - name: Upload legacy archive
        uses: actions/upload-artifact@v4
        with:
          name: nabz-legacy-linux-x86_64
          path: Nabz-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

name: Nabz mobile preview

on:
  push:
    branches:
      - tauri-web-prototype
    paths:
      - "tauri-web/**"
      - ".github/workflows/nabz-mobile-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nabz-mobile-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: tauri-web
        run: npm install
      - name: Build web preview
        working-directory: tauri-web
        run: npm run build
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: tauri-web/dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

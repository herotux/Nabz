name: Build Arch frontends

on:
  push:
    branches:
      - packaging/slint-tauri-arch
    paths:
      - 'packaging/arch/**'
      - 'install-arch.sh'
      - '.github/workflows/build-arch-frontends.yml'
      - 'slint-native/**'
      - 'tauri-web/**'
      - 'crates/nabz-core/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        frontend: [slint, tauri]
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git rust pkgconf fontconfig freetype2 libglvnd libx11 libxcb libxkbcommon wayland nodejs npm python gtk3 libayatana-appindicator librsvg openssl webkit2gtk-4.1
      - uses: actions/checkout@v4
      - name: Prepare unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build package
        run: |
          set -eux
          cp "packaging/arch/PKGBUILD.$FRONTEND" PKGBUILD
          chown builder:builder PKGBUILD
          su builder -s /bin/bash -c 'makepkg --nodeps --noconfirm --cleanbuild'
        env:
          FRONTEND: ${{ matrix.frontend }}
      - name: Verify package archive
        run: |
          set -eu
          package="$(find . -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          pacman -Qip "$package"
          mkdir -p package-root
          bsdtar -xf "$package" -C package-root
          if find package-root -type f | grep -E '(^|/)com\.herotux\.nabz\.webprototype(/|$)|nabz\.sqlite3'; then
            echo "A frontend package must not contain user accounting data" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nabz-${{ matrix.frontend }}-arch-x86_64
          path: '*.pkg.tar.zst'
          if-no-files-found: error
          retention-days: 14

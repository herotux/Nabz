name: Build Raspberry Pi 64-bit package (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-arm64:
    name: Build Slint for 64-bit Raspberry Pi OS
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libssl-dev
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build Slint ARM64
        run: |
          set -euxo pipefail
          bash scripts/fetch-font.sh
          cargo build --release --manifest-path slint-native/Cargo.toml
      - name: Package Raspberry Pi binary
        run: |
          mkdir -p dist/nabz
          install -m 0755 slint-native/target/release/nabz-slint dist/nabz/nabz-slint
          cp assets/Vazirmatn.ttf assets/OFL.txt dist/nabz/
          cat > dist/nabz/README.txt <<'GUIDE'
          Nabz Slint - Raspberry Pi OS 64-bit
          Runtime dependencies:
            sudo apt update
            sudo apt install -y libx11-6 libxcb1 libxcb-shape0 libxcb-xfixes0 libxkbcommon0 libwayland-client0 libegl1 libfontconfig1
          This is a development prototype. Back up real data before testing.
          GUIDE
          tar -C dist -czf Nabz-Slint-raspberry-pi-aarch64.tar.gz nabz
      - uses: actions/upload-artifact@v4
        with:
          name: Nabz-Slint-raspberry-pi-aarch64
          path: Nabz-Slint-raspberry-pi-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 30

name: Legacy egui Raspberry Pi packages (main only)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build for 64-bit Raspberry Pi OS
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build and package
        run: |
          set -euxo pipefail
          rustc -vV
          bash scripts/fetch-font.sh
          cargo build --release
          mkdir -p dist/nabz
          install -m 0755 target/release/nabz dist/nabz/nabz
          cp README.md LICENSE dist/nabz/
          cp assets/Vazirmatn.ttf assets/OFL.txt dist/nabz/
          tar -C dist -czf Nabz-linux-aarch64-unknown-linux-gnu.tar.gz nabz

      - name: Upload Raspberry Pi package
        uses: actions/upload-artifact@v4
        with:
          name: Nabz-linux-aarch64-unknown-linux-gnu
          path: Nabz-linux-aarch64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-armv7:
    name: Build for 32-bit Raspberry Pi OS
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build under ARM emulation
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates curl build-essential pkg-config \
              libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
              libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          run: |
            set -euxo pipefail
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            rustc -vV
            bash scripts/fetch-font.sh
            cargo build --release
            mkdir -p dist/nabz
            install -m 0755 target/release/nabz dist/nabz/nabz
            cp README.md LICENSE dist/nabz/
            cp assets/Vazirmatn.ttf assets/OFL.txt dist/nabz/
            tar -C dist -czf Nabz-linux-armv7-unknown-linux-gnueabihf.tar.gz nabz

      - name: Upload Raspberry Pi package
        uses: actions/upload-artifact@v4
        with:
          name: Nabz-linux-armv7-unknown-linux-gnueabihf
          path: Nabz-linux-armv7-unknown-linux-gnueabihf.tar.gz
          if-no-files-found: error
          retention-days: 30

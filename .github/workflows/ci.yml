name: Legacy root Rust tests
on:
  push:
    branches: [main, feature/slint-native-ui]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "assets/**"
      - "scripts/**"
      - "slint-native/**"
      - "tauri-web/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabz-legacy-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Fetch bundled Persian font
        run: bash scripts/fetch-font.sh
      - uses: Swatinem/rust-cache@v2
      - name: Format Rust source
        run: cargo fmt --all
      - name: Run hardware support tests
        run: cargo test --all-targets hardware::tests
      - name: Run unit tests
        run: cargo test --all-targets
      - name: Lint
        run: cargo clippy --all-targets
      - name: Verify release build
        run: cargo build --release

name: Rust tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Fetch bundled Persian font
        run: bash scripts/fetch-font.sh
      - uses: Swatinem/rust-cache@v2
      - name: Format Rust source
        run: cargo fmt --all
      - name: Run unit tests
        run: cargo test --all-targets
      - name: Lint
        run: cargo clippy --all-targets
      - name: Verify release build
        run: cargo build --release

name: Nabz Raspberry Pi OS ARM64

on:
  push:
    branches:
      - "**"
    paths:
      - "tauri-web/**"
      - "crates/nabz-core/**"
      - "assets/**"
      - "scripts/fetch-font.sh"
      - ".github/workflows/raspberry-pi-arm64.yml"
  pull_request:
    paths:
      - "tauri-web/**"
      - "crates/nabz-core/**"
      - "assets/**"
      - "scripts/fetch-font.sh"
      - ".github/workflows/raspberry-pi-arm64.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabz-raspberry-pi-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-raspberry-pi:
    name: Build Raspberry Pi OS 64-bit (ARM64)
    runs-on: ubuntu-22.04-arm
    defaults:
      run:
        working-directory: tauri-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ARM64 runner
        run: |
          test "$(uname -m)" = "aarch64"
          ldd --version | head -n1

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libxdo-dev curl wget file patchelf zip \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libglib2.0-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-web/src-tauri -> target

      - name: Generate application icon
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          size = 256
          rows = []
          for y in range(size):
              row = bytearray([0])
              for x in range(size):
                  edge = min(x, y, size - 1 - x, size - 1 - y)
                  bg = (20, 128, 88, 255) if edge >= 10 else (13, 105, 71, 255)
                  mark = (62 <= x <= 91 and 62 <= y <= 190) or (165 <= x <= 194 and 62 <= y <= 190)
                  mark = mark or (62 <= x <= 194 and abs(y - (190 - (x - 62) * 128 / 132)) <= 14)
                  row.extend((245, 249, 255, 255) if mark else bg)
              rows.append(bytes(row))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          png = bytes([137, 80, 78, 71, 13, 10, 26, 10])
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
          png += chunk(b"IEND", b"")
          target = Path("src-tauri/icons/icon.png")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(png)
          assert target.read_bytes().startswith(bytes([137, 80, 78, 71, 13, 10, 26, 10]))
          PY

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend tests
        run: npm run test

      - name: Fetch bundled Persian font
        run: |
          cd ..
          bash scripts/fetch-font.sh
          test -s assets/Vazirmatn.ttf

      - name: Build frontend and type-check
        env:
          TAURI_ENV_PLATFORM: linux
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/index.html
          test -s public/fonts/Vazirmatn.woff2
          test -s dist/fonts/Vazirmatn.woff2

      - name: Run Rust and SQLite tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build native ARM64 application
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin nabz-tauri --features custom-protocol
          file src-tauri/target/release/nabz-tauri
          readelf -h src-tauri/target/release/nabz-tauri | grep -E 'Class:|Machine:'
          readelf -h src-tauri/target/release/nabz-tauri | grep -q 'AArch64'

      - name: Assemble installable ZIP
        run: |
          set -eux
          VERSION="$(node -p "require('./package.json').version")"
          STAGE="$RUNNER_TEMP/Nabz-Raspberry-Pi-ARM64"
          mkdir -p "$STAGE/bin" "$STAGE/share/applications" "$STAGE/share/icons"
          install -Dm755 src-tauri/target/release/nabz-tauri "$STAGE/bin/nabz"
          install -Dm644 src-tauri/icons/icon.png "$STAGE/share/icons/nabz.png"
          install -Dm644 ../LICENSE "$STAGE/LICENSE"
          cat > "$STAGE/share/applications/nabz.desktop" <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=نبض
          GenericName=حسابداری فروشگاهی
          Comment=حسابداری فروشگاهی فارسی
          Exec=nabz
          Icon=nabz
          Terminal=false
          Categories=Office;Finance;
          StartupNotify=true
          DESKTOP
          cp packaging/raspberry-pi/install.sh "$STAGE/install.sh"
          chmod +x "$STAGE/install.sh"
          cat > "$STAGE/README-FA.txt" <<EOF
          نصب نبض روی Raspberry Pi OS 64-bit
          نسخه: $VERSION
          معماری: ARM64 / aarch64
          
          فایل ZIP را استخراج کن و در پوشه استخراج‌شده اجرا کن:
            ./install.sh
          
          نصب‌کننده وابستگی‌های لازم را از مخازن رسمی Debian نصب می‌کند.
          برنامه برای کاربر فعلی نصب می‌شود و اطلاعات/پایگاه داده قبلی را حذف نمی‌کند.
          اجرای برنامه: از منوی برنامه‌ها یا دستور nabz
          EOF
          (cd "$RUNNER_TEMP" && zip -qr "Nabz-Raspberry-Pi-OS-ARM64-v$VERSION.zip" "Nabz-Raspberry-Pi-ARM64")
          mv "$RUNNER_TEMP/Nabz-Raspberry-Pi-OS-ARM64-v$VERSION.zip" ./Nabz-Raspberry-Pi-OS-ARM64.zip
          sha256sum Nabz-Raspberry-Pi-OS-ARM64.zip > Nabz-Raspberry-Pi-OS-ARM64.zip.sha256
          unzip -l Nabz-Raspberry-Pi-OS-ARM64.zip

      - name: Upload Raspberry Pi ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nabz-raspberry-pi-os-64-bit-arm64
          path: |
            tauri-web/Nabz-Raspberry-Pi-OS-ARM64.zip
            tauri-web/Nabz-Raspberry-Pi-OS-ARM64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            tauri-web/Nabz-Raspberry-Pi-OS-ARM64.zip
            tauri-web/Nabz-Raspberry-Pi-OS-ARM64.zip.sha256

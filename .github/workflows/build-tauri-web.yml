name: Build Nabz Tauri Web
on:
  workflow_dispatch:
  push:
    branches: [tauri-web-prototype]
    paths:
      - 'tauri-web/**'
      - '.github/workflows/build-tauri-web.yml'
jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libfuse2
      - name: Replace invalid app icon with a valid PNG
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          size = 256
          rows = []
          for y in range(size):
              row = bytearray([0])
              for x in range(size):
                  # Rounded-looking teal tile with a simple white Persian-inspired mark.
                  edge = min(x, y, size - 1 - x, size - 1 - y)
                  bg = (min(20 + x // 32, 28), min(112 + y // 12, 140), min(170 + x // 16, 195), 255)
                  if edge < 10:
                      bg = (18, 92, 148, 255)
                  # A bold, geometric white N mark, kept away from the icon edges.
                  mark = (62 <= x <= 91 and 62 <= y <= 190) or (165 <= x <= 194 and 62 <= y <= 190)
                  mark = mark or (x >= 62 and x <= 194 and abs(y - (190 - (x - 62) * 128 / 132)) <= 14)
                  row.extend((245, 249, 255, 255) if mark else bg)
              rows.append(bytes(row))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          raw = b"".join(rows)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(raw, 9))
          png += chunk(b"IEND", b"")
          target = Path("tauri-web/src-tauri/icons/icon.png")
          target.write_bytes(png)
          print(f"Wrote valid {size}x{size} RGBA PNG: {target} ({len(png)} bytes)")
          PY
          file tauri-web/src-tauri/icons/icon.png
      - name: Install Node dependencies
        working-directory: tauri-web
        run: npm install
      - name: Run Nabz accounting regression tests
        working-directory: tauri-web
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Install Node dependencies
        working-directory: tauri-web
        run: npm install
      - name: Build Tauri app
        working-directory: tauri-web
        run: npm run tauri build
      - name: Verify Linux packages
        run: |
          test -n "$(find tauri-web/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find tauri-web/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: nabz-tauri-web-linux
          path: |
            tauri-web/src-tauri/target/release/bundle/deb/*.deb
            tauri-web/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

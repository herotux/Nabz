name: Build Nabz Tauri Web
on:
  workflow_dispatch:
  push:
    branches: [tauri-web-prototype]
    paths:
      - 'tauri-web/**'
      - '.github/workflows/build-tauri-web.yml'
jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libfuse2
      - name: Install Node dependencies
        working-directory: tauri-web
        run: npm install
      - name: Build Tauri app
        working-directory: tauri-web
        run: npm run tauri build
      - name: Verify Linux packages
        run: |
          test -n "$(find tauri-web/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find tauri-web/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: nabz-tauri-web-linux
          path: |
            tauri-web/src-tauri/target/release/bundle/deb/*.deb
            tauri-web/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

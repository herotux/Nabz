name: Build Nabz Tauri Windows
on:
  push:
    branches: [tauri-web-prototype]
    paths:
      - "tauri-web/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabz-tauri-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tauri-web/package-lock.json

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend and type-check
        run: npm run build

      - name: Run Rust and SQLite tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Windows installers (MSI and NSIS)
        run: npm run tauri build -- --bundles msi,nsis

      - name: Verify installers
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $msi -or -not $nsis) { throw "Expected both MSI and NSIS installers, but one or both are missing." }
          $msi | ForEach-Object { Write-Host $_.FullName }
          $nsis | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: nabz-tauri-windows-x64
          path: |
            tauri-web/src-tauri/target/release/bundle/msi/*.msi
            tauri-web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

name: Nabz Tauri Web CI

on:
  push:
    branches:
      - main
      - tauri-web-prototype
    paths:
      - "tauri-web/**"
      - ".github/workflows/tauri-web-ci.yml"
  pull_request:
    paths:
      - "tauri-web/**"
      - ".github/workflows/tauri-web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabz-tauri-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tauri-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libxdo-dev curl wget file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-web/src-tauri -> target

      - name: Generate a valid PNG app icon
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          size = 256
          rows = []
          for y in range(size):
              row = bytearray([0])
              for x in range(size):
                  edge = min(x, y, size - 1 - x, size - 1 - y)
                  bg = (min(20 + x // 32, 28), min(112 + y // 12, 140), min(170 + x // 16, 195), 255)
                  if edge < 10:
                      bg = (18, 92, 148, 255)
                  mark = (62 <= x <= 91 and 62 <= y <= 190) or (165 <= x <= 194 and 62 <= y <= 190)
                  mark = mark or (62 <= x <= 194 and abs(y - (190 - (x - 62) * 128 / 132)) <= 14)
                  row.extend((245, 249, 255, 255) if mark else bg)
              rows.append(bytes(row))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          raw = b"".join(rows)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(raw, 9))
          png += chunk(b"IEND", b"")
          target = Path("src-tauri/icons/icon.png")
          target.write_bytes(png)
          print(f"Generated valid {size}x{size} RGBA PNG: {target} ({len(png)} bytes)")
          PY
          file src-tauri/icons/icon.png

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend and type-check
        run: npm run build

      - name: Run Rust and SQLite tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Linux packages
        run: npm run tauri build

      - name: Verify generated packages
        run: |
          set -eu
          find src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' \) -size +0c -print
          test -n "$(find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' \) -size +0c -print -quit)"

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: nabz-linux-installers
          path: |
            tauri-web/src-tauri/target/release/bundle/**/*.AppImage
            tauri-web/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 14

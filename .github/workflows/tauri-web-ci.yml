name: Nabz Tauri / Arch CI

on:
  push:
    branches:
      - main
      - ui/react-tauri-redesign
    paths:
      - "tauri-web/**"
      - "crates/nabz-core/**"
      - "docs/architecture/**"
      - "README.md"
      - ".github/workflows/tauri-web-ci.yml"
  pull_request:
    paths:
      - "tauri-web/**"
      - "crates/nabz-core/**"
      - "docs/architecture/**"
      - "README.md"
      - ".github/workflows/tauri-web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabz-tauri-arch-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-and-build-arch:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tauri-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libxdo-dev curl wget file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libglib2.0-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-web/src-tauri -> target

      - name: Generate a valid PNG app icon
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          size = 256
          rows = []
          for y in range(size):
              row = bytearray([0])
              for x in range(size):
                  edge = min(x, y, size - 1 - x, size - 1 - y)
                  bg = (20, 128, 88, 255)
                  if edge < 10:
                      bg = (13, 105, 71, 255)
                  mark = (62 <= x <= 91 and 62 <= y <= 190) or (165 <= x <= 194 and 62 <= y <= 190)
                  mark = mark or (62 <= x <= 194 and abs(y - (190 - (x - 62) * 128 / 132)) <= 14)
                  row.extend((245, 249, 255, 255) if mark else bg)
              rows.append(bytes(row))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
          png += chunk(b"IEND", b"")
          target = Path("src-tauri/icons/icon.png")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(png)
          PY
          file src-tauri/icons/icon.png

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend and type-check
        run: npm run build

      - name: Report frontend bundle size
        run: |
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          dist = Path("dist")
          assets = sorted((p for p in (dist / "assets").glob("*") if p.is_file()), key=lambda p:p.stat().st_size, reverse=True)
          files = [p for p in dist.rglob("*") if p.is_file()]
          raw = sum(p.stat().st_size for p in files)
          gz = sum(len(gzip.compress(p.read_bytes(), compresslevel=9)) for p in files)
          lines = ["Nabz frontend bundle report", f"Total dist raw: {raw} bytes", f"Total dist gzip: {gz} bytes", "", "Largest assets:"]
          lines += [f"{p.name}: {p.stat().st_size} bytes; gzip {len(gzip.compress(p.read_bytes(), compresslevel=9))} bytes" for p in assets[:15]]
          report = "\n".join(lines) + "\n"
          Path("bundle-performance-report.txt").write_text(report)
          print(report)
          PY

      - name: Verify release versions are consistent
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          frontend = json.loads(Path("package.json").read_text())["version"]
          tauri = json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"]
          def cargo_version(path):
              content = Path(path).read_text()
              package = content.split("[package]", 1)[1].split("\n[", 1)[0]
              version_line = next(line for line in package.splitlines() if line.strip().startswith("version"))
              return version_line.split("=", 1)[1].strip().strip('"')
          cargo = cargo_version("src-tauri/Cargo.toml")
          core = cargo_version("../crates/nabz-core/Cargo.toml")
          pkgbuild = re.search(r"^pkgver=(.+)$", Path("packaging/arch/PKGBUILD").read_text(), re.M).group(1)
          versions = {"package.json": frontend, "tauri.conf.json": tauri, "Cargo.toml": cargo, "nabz-core": core, "PKGBUILD": pkgbuild}
          print(versions)
          assert len(set(versions.values())) == 1, "Version mismatch between app and Arch package"
          PY

      - name: Run Rust and SQLite tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build optimized Tauri executable
        id: release-build
        run: |
          started=$(date +%s)
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin nabz-tauri
          finished=$(date +%s)
          echo "seconds=$((finished-started))" >> "$GITHUB_OUTPUT"

      - name: Report optimized runtime footprint
        run: |
          binary="src-tauri/target/release/nabz-tauri"
          test -s "$binary"
          bytes=$(stat -c '%s' "$binary")
          echo "" >> bundle-performance-report.txt
          echo "Optimized Tauri executable: $bytes bytes" >> bundle-performance-report.txt
          echo "Release build wall time: ${{ steps.release-build.outputs.seconds }} seconds" >> bundle-performance-report.txt
          echo "SQLite runtime: bundled; schema version and query indexes are covered by Rust tests." >> bundle-performance-report.txt
          cat bundle-performance-report.txt

      - name: Prepare Arch package inputs
        run: |
          set -eux
          test -s src-tauri/target/release/nabz-tauri
          mkdir -p packaging/arch
          install -Dm755 src-tauri/target/release/nabz-tauri packaging/arch/nabz-tauri
          install -Dm644 src-tauri/icons/icon.png packaging/arch/nabz.png
          install -Dm644 ../LICENSE packaging/arch/LICENSE
          cat > packaging/arch/nabz.desktop <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=نبض
          GenericName=حسابداری فروشگاهی
          Comment=حسابداری فروشگاهی فارسی
          Exec=nabz
          Icon=nabz
          Terminal=false
          Categories=Office;Finance;
          StartupNotify=true
          DESKTOP

      - name: Build native Arch / Manjaro package
        run: |
          docker run --rm \
            -v "$PWD/packaging/arch:/pkg" \
            archlinux:latest bash -lc '
              pacman -Syu --noconfirm --needed base-devel webkit2gtk-4.1 gtk3 openssl
              useradd --create-home builder
              chown -R builder:builder /pkg
              cd /pkg
              runuser -u builder -- makepkg --cleanbuild --noconfirm
              pacman -U --noconfirm /pkg/*.pkg.tar.zst
              pacman -Ql nabz-tauri
            '

      - name: Verify generated package
        run: |
          set -eux
          find packaging/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' -size +0c -print
          test -n "$(find packaging/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' -size +0c -print -quit)"
          file packaging/arch/*.pkg.tar.zst

      - name: Upload frontend performance report
        uses: actions/upload-artifact@v4
        with:
          name: nabz-frontend-bundle-report
          path: tauri-web/bundle-performance-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Arch / Manjaro package
        uses: actions/upload-artifact@v4
        with:
          name: nabz-manjaro-arch-x86_64
          path: tauri-web/packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

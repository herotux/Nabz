[package]
name = "nabz-slint"
version = "0.1.0"
edition = "2021"
description = "Native Slint UI prototype for Nabz Persian accounting"
license = "MIT"
build = "build.rs"

[dependencies]
slint = "1.18.1"
rusqlite = { version = "0.32", features = ["bundled"] }
nabz-core = { path = "../crates/nabz-core" }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true

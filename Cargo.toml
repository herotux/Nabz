[package]
name = "nabz"
version = "0.1.0"
edition = "2021"
authors = ["Hamid Saidy"]
description = "Lightweight Persian personal accounting app with Jalali dates"
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "x11", "wayland"] }
egui = { version = "0.36.2", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
barcoders = { version = "2.0", features = ["svg"] }
egui-phosphor = "0.14"
arabic_reshaper = "0.4"
unicode-bidi = "0.3"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true

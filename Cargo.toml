[package]
name = "nabz"
version = "0.1.0"
edition = "2021"
authors = ["Hamid Saidy"]
description = "Lightweight Persian personal accounting app with Jalali dates"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.31"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true

[package]
name = "nabz-tauri"
version = "0.1.0"
description = "Nabz Persian accounting UI"
authors = ["Herotux"]
edition = "2021"

[lib]
name = "nabz_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
nabz-core = { path = "../../crates/nabz-core" }
